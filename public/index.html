<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mevin - Hebreo Bíblico / Ibrani Alkitab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --p50:#EEEDFE;--p100:#CECBF6;--p200:#AFA9EC;--p400:#7F77DD;--p600:#534AB7;--p800:#3C3489;--p900:#26215C;
      --t1:#1a1a18;--t2:#5a5a55;--t3:#9a9a94;
      --bd:rgba(0,0,0,.1);--bdl:rgba(0,0,0,.06);
      --bg:#fafaf8;--bgs:#ffffff;--bgm:#f4f4f0;
      --rsm:6px;--rmd:8px;--rlg:12px;
      --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    }
    @media(prefers-color-scheme:dark){
      :root{
        --t1:#e8e8e4;--t2:#a8a8a2;--t3:#686862;
        --bd:rgba(255,255,255,.1);--bdl:rgba(255,255,255,.06);
        --bg:#181816;--bgs:#222220;--bgm:#2a2a28;
        --p50:#1e1c3a;--p100:#2a2650;--p900:#CECBF6;
      }
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;line-height:1.6}
    .topbar{border-bottom:.5px solid var(--bd);background:var(--bgs);position:sticky;top:0;z-index:100}
    .topbar-inner{max-width:980px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:56px}
    .brand{display:flex;align-items:baseline;gap:8px;text-decoration:none}
    .brand-heb{font-family:'Crimson Pro',serif;font-size:26px;direction:rtl;color:var(--p600);line-height:1}
    .brand-name{font-size:18px;font-weight:500;color:var(--t1);letter-spacing:-.3px}
    .brand-badge{font-size:11px;font-weight:500;color:var(--p600);background:var(--p50);border:.5px solid var(--p200);border-radius:20px;padding:2px 8px}
    .topbar-desc{font-size:12px;color:var(--t3);display:none}
    @media(min-width:600px){.topbar-desc{display:block}}
    .main{max-width:980px;margin:0 auto;padding:1.5rem;display:grid;grid-template-columns:1fr;gap:1.25rem}
    @media(min-width:720px){.main{grid-template-columns:1fr 1fr;align-items:start}.col-l{grid-column:1}.col-r{grid-column:2}}
    .card{background:var(--bgs);border:.5px solid var(--bd);border-radius:var(--rlg);padding:1.25rem;box-shadow:var(--sh)}
    .card-label{font-size:12px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
    .search-row{display:flex;gap:8px;flex-wrap:wrap}
    .ref-input{flex:1;min-width:140px;font-size:15px;font-family:inherit;padding:8px 12px;border-radius:var(--rmd);border:.5px solid var(--bd);background:var(--bgm);color:var(--t1);transition:border-color .15s,box-shadow .15s}
    .ref-input:focus{outline:none;border-color:var(--p400);box-shadow:0 0 0 3px rgba(127,119,221,.12)}
    .version-select{font-size:13px;font-family:inherit;padding:8px 10px;border-radius:var(--rmd);border:.5px solid var(--bd);background:var(--bgm);color:var(--t2);cursor:pointer}
    .btn{font-size:14px;font-family:inherit;font-weight:500;padding:8px 16px;border-radius:var(--rmd);border:.5px solid var(--p200);background:var(--p50);color:var(--p800);cursor:pointer;white-space:nowrap;transition:background .15s}
    .btn:hover{background:var(--p100)}.btn:active{transform:scale(.98)}
    .quick-tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px}
    .tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bgm);color:var(--t2);border:.5px solid var(--bd);cursor:pointer;transition:all .12s}
    .tag:hover{background:var(--p50);color:var(--p800);border-color:var(--p200)}
    .error-msg{margin-top:10px;font-size:13px;color:#a32d2d;background:#FCEBEB;border-radius:var(--rsm);padding:8px 12px}
    .loading-bar{height:2px;background:var(--p50);border-radius:2px;overflow:hidden;margin-top:10px}
    .loading-bar-fill{height:100%;width:30%;background:var(--p400);border-radius:2px;animation:slide 1.2s ease-in-out infinite}
    @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
    .verse-card{background:var(--bgs);border:.5px solid var(--bd);border-radius:var(--rlg);padding:1.25rem 1.5rem;box-shadow:var(--sh)}
    .verse-ref{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
    .verse-text{font-family:'Crimson Pro',serif;font-size:24px;line-height:2;text-align:right;direction:rtl;color:var(--t1);unicode-bidi:bidi-override}
    .verse-word{cursor:pointer;padding:2px 5px;border-radius:4px;transition:background .12s;display:inline-block}
    .verse-word:hover{background:var(--p50)}.verse-word.selected{background:var(--p100);color:var(--p900)}
    .verse-hint{font-size:12px;color:var(--t3);margin-top:10px;text-align:center}
    .trans-block{margin-top:10px;padding-top:10px;border-top:.5px solid var(--bdl)}
    .trans-label{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
    .trans-text{font-size:14px;color:var(--t2);line-height:1.65}.trans-text.idn{font-style:italic}.trans-na{font-size:12px;color:var(--t3);font-style:italic}
    .trans-loading{font-size:13px;color:var(--t3);font-style:italic}
    .analysis-card{background:var(--bgs);border:.5px solid var(--bd);border-radius:var(--rlg);overflow:hidden;box-shadow:var(--sh)}
    .analysis-header{padding:14px 16px;background:var(--bgm);border-bottom:.5px solid var(--bdl)}
    .analysis-word{font-family:'Crimson Pro',serif;font-size:30px;direction:rtl;color:var(--p900);line-height:1.2}
    .analysis-meta{font-size:13px;color:var(--t2);margin-top:4px}
    .analysis-meta span{color:var(--p600);font-weight:500}
    .analysis-meta code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--t3);background:var(--bgm);padding:1px 5px;border-radius:3px}
    .morph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:12px 16px}
    .morph-badge{background:var(--bgm);border-radius:var(--rmd);padding:8px 10px;border:.5px solid var(--bdl)}
    .morph-badge .ml{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
    .morph-badge .mv{font-size:13px;font-weight:500;color:var(--t1)}
    .morph-badge.hi .mv{color:var(--p600)}
    .refs-panel{border-top:.5px solid var(--bdl);padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .refs-label{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-right:4px;flex-shrink:0}
    .ref-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:20px;border:.5px solid var(--bd);background:var(--bgm);color:var(--t2);text-decoration:none;transition:all .12s;cursor:pointer}
    .ref-chip:hover{background:var(--p50);color:var(--p800);border-color:var(--p200)}
    .ref-chip.uhg{border-color:#9FE1CB;background:#E1F5EE;color:#085041}
    .ref-chip.uhg:hover{background:#9FE1CB}
    .ref-chip.ges{border-color:#FAC775;background:#FAEEDA;color:#633806}
    .ref-chip.ges:hover{background:#FAC775}
    .ref-chip.etcbc{border-color:#A8C4E0;background:#E3EFF8;color:#0D3A5C}
    .ref-chip.etcbc:hover{background:#A8C4E0}
    .ref-chip svg{flex-shrink:0}
    .tutor-section{border-top:.5px solid var(--bdl);padding:14px 16px}
    .tutor-label{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .tutor-content{font-size:14px;color:var(--t1);line-height:1.75}
    .tutor-content p{margin-bottom:8px}
    .tutor-loading{font-size:14px;color:var(--t3);font-style:italic}
    .source-tabs{display:flex;gap:0;border-bottom:.5px solid var(--bdl);margin-bottom:12px;flex-wrap:wrap}
    .stab{font-size:12px;font-weight:500;padding:7px 12px;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
    .stab:hover{color:var(--t2)}.stab.active{color:var(--p600);border-bottom-color:var(--p600)}
    .stab-panel{display:none}.stab-panel.active{display:block}
    .source-content{font-size:13px;color:var(--t2);line-height:1.7;background:var(--bgm);border-radius:var(--rmd);padding:10px 12px;max-height:260px;overflow-y:auto;border:.5px solid var(--bdl)}
    .source-content p{margin-bottom:6px}
    .source-loading{font-size:13px;color:var(--t3);font-style:italic;padding:8px 0}
    .source-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--p600);text-decoration:none;margin-top:8px;font-weight:500}
    .source-link:hover{text-decoration:underline}
    .question-row{display:flex;gap:8px;margin-top:14px}
    .question-input{flex:1;font-size:14px;font-family:inherit;padding:8px 12px;border-radius:var(--rmd);border:.5px solid var(--bd);background:var(--bgm);color:var(--t1)}
    .question-input:focus{outline:none;border-color:var(--p400);box-shadow:0 0 0 3px rgba(127,119,221,.12)}
    .btn-ask{font-size:13px;font-family:inherit;font-weight:500;padding:8px 14px;border-radius:var(--rmd);border:.5px solid var(--p200);background:var(--p50);color:var(--p800);cursor:pointer;white-space:nowrap}
    .btn-ask:hover{background:var(--p100)}
    .empty-state{padding:3rem 1.5rem;text-align:center;color:var(--t3);font-size:14px;line-height:1.7}
    .empty-icon{font-size:2.5rem;margin-bottom:1rem}
    footer{max-width:980px;margin:0 auto;padding:1.5rem 1.5rem 2.5rem;font-size:12px;color:var(--t3);border-top:.5px solid var(--bdl);line-height:1.7}
    footer a{color:var(--p400);text-decoration:none}footer a:hover{text-decoration:underline}
    .topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
    .lang-toggle{display:inline-flex;border:.5px solid var(--p200);border-radius:20px;overflow:hidden}
    .lang-btn{font-size:12px;font-weight:500;font-family:inherit;padding:4px 10px;border:none;background:var(--bgs);color:var(--t2);cursor:pointer}
    .lang-btn.active{background:var(--p50);color:var(--p800)}
    .trans-text.idn{font-style:italic}
    .trans-na{font-size:12px;color:var(--t3);font-style:italic}
    .src-note{font-size:11px;color:var(--t3);margin-top:8px;font-style:italic}
  </style>
</head>

</main>

function parseMorph(code){
  if(!code) return [];
  var M=MORPH[LANG], p=[], pos=code[0];
  p.push({label:t('lblCat'),value:M.pos[pos]||pos,hi:true});
  if(pos==='V'){
    if(code[1]) p.push({label:t('lblStem'),value:STEMS[code[1]]||code[1]});
    if(code[2]) p.push({label:t('lblTam'),value:M.tense[code[2]]||code[2]});
    if(code[3]) p.push({label:t('lblPers'),value:M.person[code[3]]||code[3]});
    if(code[4]) p.push({label:t('lblGen'),value:M.gender[code[4]]||code[4]});
    if(code[5]) p.push({label:t('lblNum'),value:M.number[code[5]]||code[5]});
  } else if(pos==='N'||pos==='A'){
    if(code[1]) p.push({label:t('lblGen'),value:M.gender[code[1]]||code[1]});
    if(code[2]) p.push({label:t('lblNum'),value:M.number[code[2]]||code[2]});
    if(code[3]) p.push({label:t('lblState'),value:M.state[code[3]]||code[3]});
  } else if(pos==='P'){
    if(code[1]) p.push({label:t('lblType'),value:M.ptype[code[1]]||code[1]});
    if(code[2]) p.push({label:t('lblPers'),value:M.person[code[2]]||code[2]});
    if(code[3]) p.push({label:t('lblGen'),value:M.gender[code[3]]||code[3]});
    if(code[4]) p.push({label:t('lblNum'),value:M.number[code[4]]||code[4]});
  } else if(pos==='T'){
    if(code[1]) p.push({label:t('lblType'),value:M.ttype[code[1]]||code[1]});
  } else if(pos==='R'){ p.push({label:t('lblType'),value:M.prep});
  } else if(pos==='C'){ p.push({label:t('lblType'),value:M.conj}); }
  return p;
}

function escHtml(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function inlineMd(x){
  return x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
          .replace(/__(.+?)__/g,'<strong>$1</strong>')
          .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<em>$2</em>')
          .replace(/`([^`]+)`/g,'<em>$1</em>');
}
// Convierte Markdown en HTML limpio para que no se vean asteriscos ni almohadillas.
function renderMd(text){
  var lines=escHtml(text||'').split('\n'), out=[], list=null;
  function closeList(){ if(list){ out.push('</'+list+'>'); list=null; } }
  lines.forEach(function(raw){
    var l=raw.trim();
    if(!l){ closeList(); return; }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(l)){ closeList(); return; }
    var h=l.match(/^#{1,6}\s+(.*)$/);
    if(h){ closeList(); out.push('<p><strong>'+inlineMd(h[1])+'</strong></p>'); return; }
    var ul=l.match(/^[-*•]\s+(.*)$/), ol=l.match(/^\d+[.)]\s+(.*)$/);
    if(ul||ol){
      var tag=ul?'ul':'ol';
      if(list!==tag){ closeList(); out.push('<'+tag+' style="margin:0 0 8px 20px">'); list=tag; }
      out.push('<li>'+inlineMd((ul||ol)[1])+'</li>'); return;
    }
    closeList(); out.push('<p>'+inlineMd(l)+'</p>');
  });
  closeList();
  return out.join('');
}

// Llamada al modelo a través de la función /api/claude-tutor
function callClaude(system,user,maxTokens){
  return fetch('/api/claude-tutor',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({max_tokens:maxTokens||1000,system:system,messages:[{role:'user',content:user}]})})
    .then(function(r){
      return r.text().then(function(raw){
        var data=null; try{ data=JSON.parse(raw); }catch(e){}
        if(!data) throw new Error('HTTP '+r.status+': '+raw.slice(0,200));
        // Unir todos los bloques de texto (puede haber bloques de otro tipo antes del texto)
        var txt=(Array.isArray(data.content)?data.content:[]).filter(function(b){ return b&&b.text&&(!b.type||b.type==='text'); }).map(function(b){ return b.text; }).join('\n\n').trim();
        if(txt) return txt;
        var err=data.error&&(data.error.message||data.error);
        if(!err) err=t('emptyResp')+' (HTTP '+r.status+(data.stop_reason?', stop_reason: '+data.stop_reason:'')+') '+raw.slice(0,200);
        throw new Error(typeof err==='string'?err:JSON.stringify(err));
      });
    });
}

function parseRef(ref){
  ref=ref.trim().replace(/\s+/g,' ');
  var m=ref.match(/^(\d?\s*[a-záéíóúñü]+)\s*(\d+)\s*[:\.\s]\s*(\d+)$/i);
  if(!m) return null;
  var key=m[1].toLowerCase().replace(/\s/g,'').replace(/[áä]/g,'a').replace(/[éë]/g,'e').replace(/[íï]/g,'i').replace(/[óö]/g,'o').replace(/[úü]/g,'u').replace(/ñ/g,'n');
  var idx=BOOK_IDX[key];
  if(idx===undefined) return null;
  return {idx:idx,file:BOOK_FILE[idx],bookId:BOOK_API[idx],ch:parseInt(m[2],10),vs:parseInt(m[3],10)};
}
function refText(ref){ return bookName(ref.idx)+' '+ref.ch+':'+ref.vs; }

function loadVerse(refStr){
  var ref=parseRef(refStr);
  if(!ref){ showError(t('refBad')); return; }
  currentRef=ref; selectedIdx=-1; showLoading(true); clearError();
  document.getElementById('verseArea').innerHTML='';
  emptyPanel('&#8987;',t('loading'));
  fetch('https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/'+ref.file+'.xml')
    .then(function(r){ if(!r.ok) throw new Error(t('fileNF')+ref.file+'.xml'); return r.text(); })
    .then(function(xml){
      var doc=new DOMParser().parseFromString(xml,'application/xml');
      var chapters=Array.prototype.slice.call(doc.querySelectorAll('chapter'));
      var chEl=chapters.find(function(c){ return (c.getAttribute('osisID')||'').endsWith('.'+ref.ch); });
      if(!chEl) throw new Error(t('chNF')+ref.ch);
      var verseEl=Array.prototype.slice.call(chEl.querySelectorAll('verse')).find(function(v){ return (v.getAttribute('osisID')||'').endsWith('.'+ref.vs); });
      if(!verseEl) throw new Error(t('vsNF')+ref.vs);
      currentWords=Array.prototype.slice.call(verseEl.querySelectorAll('w')).map(function(w){
        return {text:w.textContent.trim(), lemma:w.getAttribute('lemma')||'', morph:(w.getAttribute('morph')||'').replace(/^H/,'')};
      }).filter(function(w){ return w.text; });
      showLoading(false);
      renderVerse();
      emptyPanel('&#128214;',t('empty'));
    })
    .catch(function(e){ showLoading(false); showError(t('errPrefix')+e.message); emptyPanel('&#128214;',t('empty')); });
}

function renderVerse(){
  if(!currentRef) return;
  var html=currentWords.map(function(w,i){
    return '<span class="verse-word'+(i===selectedIdx?' selected':'')+'" data-idx="'+i+'" title="'+escHtml(w.morph||'')+'">'+w.text+'</span>';
  }).join(' ');
  document.getElementById('verseArea').innerHTML='<div class="verse-card"><div class="verse-ref">'+escHtml(refText(currentRef))+' — Westminster Leningrad Codex</div><div class="verse-text">'+html+'</div><p class="verse-hint">'+escHtml(t('hint'))+'</p><div id="transArea"></div></div>';
  Array.prototype.slice.call(document.querySelectorAll('.verse-word')).forEach(function(el){
    el.addEventListener('click',function(){
      Array.prototype.slice.call(document.querySelectorAll('.verse-word')).forEach(function(e){ e.classList.remove('selected'); });
      el.classList.add('selected');
      selectedIdx=parseInt(el.dataset.idx,10);
      analyzeWord(selectedIdx);
    });
  });
  var mode=document.getElementById('versionSel').value;
  if(mode!=='wlc') loadTranslations(currentRef,mode);
}

// ─── TRADUCCIONES ────────────────────────────────────────────────────────────
function loadTranslations(ref,mode){
  var ta=document.getElementById('transArea'); if(!ta) return;
  var set=versionSet(mode);
  if(!set.length){ ta.innerHTML=''; return; }
  ta.innerHTML='<div class="trans-block"><span class="trans-loading">'+escHtml(t('loadingTrans'))+'</span></div>';
  var jobs=set.map(function(label){
    if(label==='KJV') return fetchKJV(ref);
    if(label==='RVR60') return fetchRVR(ref);
    if(label==='NASB') return fetchSabda(ref,'nasb','NASB');
    if(label==='TB') return fetchSabda(ref,'tb','TB');
    return fetchSabda(ref,'bis','BIMK');
  });
  Promise.all(jobs).then(function(results){
    if(ref!==currentRef) return;
    var box=document.getElementById('transArea'); if(!box) return;
    box.innerHTML=results.map(function(r){
      var italic=(r.label!=='KJV'&&r.label!=='NASB');
      var body=r.text ? '<div class="trans-text'+(italic?' idn':'')+'">'+escHtml(r.text)+'</div>' : '<div class="trans-na">'+escHtml(r.na||t('transNA'))+'</div>';
      return '<div class="trans-block"><div class="trans-label">'+r.label+'</div>'+body+'</div>';
    }).join('');
  });
}
function fetchApiBible(ref,bibleId,label){
  var path='/bibles/'+bibleId+'/verses/'+ref.bookId+'.'+ref.ch+'.'+ref.vs+'?content-type=text&include-notes=false&include-titles=false&include-chapter-numbers=false&include-verse-numbers=false';
  return fetch('/api/bible?path='+encodeURIComponent(path))
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){ return {label:label,text:(((d&&d.data&&d.data.content)||'').replace(/<[^>]+>/g,'').replace(/^\s*\d+\s*/,'').trim())}; })
    .catch(function(){ return {label:label,text:''}; });
}
// La RVR60 se busca entre las Biblias en español disponibles en tu cuenta de API.Bible
var RVR_ID=null, RVR_TRIED=false;
function findRVR(){
  if(RVR_TRIED) return Promise.resolve(RVR_ID);
  return fetch('/api/bible?path='+encodeURIComponent('/bibles?language=spa'))
    .then(function(r){ return r.ok?r.json():{data:[]}; })
    .then(function(d){
      RVR_TRIED=true;
      ((d&&d.data)||[]).some(function(b){
        var txt=[b.abbreviation,b.abbreviationLocal,b.name,b.nameLocal].join(' ').toUpperCase();
        if(/RVR ?(19)?60|REINA[- ]VALERA 1960|REINA VALERA REVISADA 1960/.test(txt)){ RVR_ID=b.id; return true; }
        return false;
      });
      return RVR_ID;
    })
    .catch(function(){ RVR_TRIED=true; return null; });
}
function fetchRVR(ref){
  return findRVR().then(function(id){
    if(!id) return {label:'RVR60',text:'',na:t('rvrNA')};
    return fetchApiBible(ref,id,'RVR60');
  });
}
function fetchKJV(ref){ return fetchApiBible(ref,KJV_ID,'KJV'); }
function fetchSabda(ref,ver,label){
  var q='book='+encodeURIComponent(SABDA_ABBR[ref.idx])+'&ch='+ref.ch+'&vs='+ref.vs+'&ver='+ver;
  return fetch('/api/sabda?'+q)
    .then(function(r){ return r.json(); })
    .then(function(d){ return {label:label,text:(d&&d.text)||''}; })
    .catch(function(){ return {label:label,text:''}; });
}

// ─── ANÁLISIS DE PALABRA ─────────────────────────────────────────────────────
function buildRefChips(refs){
  var html='<div class="refs-panel"><span class="refs-label">'+escHtml(t('refs'))+'</span>';
  if(currentRef){
    var url='https://shebanq.ancient-data.org/hebrew/text?book='+SHEBANQ_BOOKS[currentRef.idx]+'&chapter='+currentRef.ch+'&verse='+currentRef.vs+'&version=2021&mr=m&tp=txt_p';
    html+='<a class="ref-chip etcbc" href="'+url+'" target="_blank" rel="noopener">'+ICON_SEARCH+'SHEBANQ / BHSA</a>';
  }
  refs.forEach(function(r){
    if(r.type==='uhg') html+='<a class="ref-chip uhg" href="https://uhg.readthedocs.io/en/latest/'+r.page+'.html" target="_blank" rel="noopener">'+ICON_BOOK+'UHG: '+escHtml(refLabel(r))+'</a>';
    else html+='<a class="ref-chip ges" href="https://en.wikisource.org/wiki/Gesenius%27_Hebrew_Grammar/'+r.ges+'" target="_blank" rel="noopener">'+ICON_BOOK+'Gesenius: '+escHtml(r.gtitle)+'</a>';
  });
  return html+'</div>';
}

function analyzeWord(idx){
  var word=currentWords[idx]; if(!word) return;
  var seq=++analysisSeq;
  var morphParts=parseMorph(word.morph);
  var lemma=word.lemma.replace(/H/g,'').replace(/\//g,' / ');
  var gramRefs=getGrammarRefs(word.morph);
  var morphHtml=morphParts.length
    ? morphParts.map(function(p){ return '<div class="morph-badge'+(p.hi?' hi':'')+'"><div class="ml">'+escHtml(p.label)+'</div><div class="mv">'+escHtml(p.value)+'</div></div>'; }).join('')
    : '<div style="padding:8px 0;font-size:13px;color:var(--t3)">'+t('code')+': <code>'+escHtml(word.morph||'n/a')+'</code></div>';

  document.getElementById('analysisArea').innerHTML=
    '<div class="analysis-card">'+
      '<div class="analysis-header"><div class="analysis-word">'+word.text+'</div>'+
      '<div class="analysis-meta">'+t('lexeme')+': <span>H'+escHtml(lemma||'-')+'</span> &nbsp;·&nbsp; Morph: <code>'+escHtml(word.morph||'-')+'</code></div></div>'+
      '<div class="morph-grid">'+morphHtml+'</div>'+
      buildRefChips(gramRefs)+
      '<div class="tutor-section">'+
        '<div class="source-tabs">'+
          '<button class="stab active" data-tab="tutor">&#10022; Mevin</button>'+
          '<button class="stab" data-tab="uhg">UHG</button>'+
          '<button class="stab" data-tab="ges">Gesenius</button>'+
          '<button class="stab" data-tab="etcbc">SHEBANQ</button>'+
        '</div>'+
        '<div class="stab-panel active" id="tab-tutor">'+
          '<div class="tutor-loading" id="tutorLoading">'+escHtml(t('tutorLoading'))+'</div>'+
          '<div class="tutor-content" id="tutorContent" style="display:none"></div>'+
          '<div class="question-row" id="questionRow" style="display:none">'+
            '<input class="question-input" id="qInput" type="text" placeholder="'+escHtml(t('askPh'))+'"/>'+
            '<button class="btn-ask" id="qBtn">'+escHtml(t('ask'))+'</button>'+
          '</div>'+
        '</div>'+
        '<div class="stab-panel" id="tab-uhg"><div class="source-loading" id="uhgLoading">'+escHtml(t('uhgLoading'))+'</div><div class="source-content" id="uhgContent" style="display:none"></div><div id="uhgLinks"></div></div>'+
        '<div class="stab-panel" id="tab-ges"><div class="source-content" id="gesContent"></div></div>'+
        '<div class="stab-panel" id="tab-etcbc"><div class="source-content" id="etcbcContent"></div></div>'+
      '</div>'+
    '</div>';

  Array.prototype.slice.call(document.querySelectorAll('.stab')).forEach(function(btn){
    btn.addEventListener('click',function(){
      Array.prototype.slice.call(document.querySelectorAll('.stab')).forEach(function(b){ b.classList.remove('active'); });
      Array.prototype.slice.call(document.querySelectorAll('.stab-panel')).forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    });
  });
  document.getElementById('qBtn').addEventListener('click',askFollowUp);
  document.getElementById('qInput').addEventListener('keydown',function(e){ if(e.key==='Enter') askFollowUp(); });

  // SHEBANQ
  var shUrl='https://shebanq.ancient-data.org/hebrew/text?book='+SHEBANQ_BOOKS[currentRef.idx]+'&chapter='+currentRef.ch+'&verse='+currentRef.vs+'&version=2021&mr=m&tp=txt_p';
  document.getElementById('etcbcContent').innerHTML=
    '<div style="font-size:13px;font-weight:500;color:var(--t1);margin-bottom:6px">SHEBANQ — ETCBC / BHSA 2021</div>'+
    '<div style="font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:10px">'+t('shbIntro')+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+
      '<a class="source-link" href="'+shUrl+'" target="_blank" rel="noopener">'+ICON_OUT+' '+escHtml(t('shbSee',{ref:refText(currentRef)}))+'</a>'+
      '<a class="source-link" href="https://shebanq.ancient-data.org/hebrew/text?version=2021" target="_blank" rel="noopener">'+ICON_OUT+' '+t('shbOpen',{w:word.text})+'</a>'+
    '</div>'+
    '<div style="margin-top:10px;padding:8px 10px;background:var(--bgs);border-radius:var(--rmd);border:.5px solid var(--bdl)">'+
      '<div style="font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">'+escHtml(t('shbNoteT'))+'</div>'+
      '<div style="font-size:12px;color:var(--t2);line-height:1.6">'+escHtml(t('shbNote'))+'</div>'+
    '</div>'+
    '<hr style="border:none;border-top:.5px solid var(--bdl);margin:10px 0"/>'+
    '<div style="font-size:12px;color:var(--t3);line-height:1.6">'+escHtml(t('shbFeat'))+'<br><span style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:var(--t2)">sp · pdp · ls · gn · nu · ps · st · vs · vt · lex · gloss · voc_lex · nme · pfm · prs · uvf · function · typ · rela · clause_atom</span></div>';

  // Gesenius
  var gesRefs=gramRefs.filter(function(r){ return r.ges; });
  document.getElementById('gesContent').innerHTML=gesRefs.length
    ? gesRefs.map(function(r){
        return '<div style="margin-bottom:10px"><div style="font-size:13px;font-weight:500;color:var(--t1);margin-bottom:4px">'+escHtml(r.gtitle)+'</div>'+
          '<div style="font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:6px">'+escHtml(t('gesIntro',{n:r.ges}))+'</div>'+
          '<a class="source-link" href="https://en.wikisource.org/wiki/Gesenius%27_Hebrew_Grammar/'+r.ges+'" target="_blank" rel="noopener">'+ICON_OUT+escHtml(t('gesOpen',{n:r.ges}))+'</a></div>';
      }).join('<hr style="border:none;border-top:.5px solid var(--bdl);margin:10px 0"/>')
    : '<p style="font-size:13px;color:var(--t3)">'+escHtml(t('gesNone'))+'</p>';

  // UHG + tutor
  var pages=[], seen={};
  gramRefs.forEach(function(r){ if(r.page&&!seen[r.page]){ seen[r.page]=true; pages.push(r.page); } });
  document.getElementById('uhgLinks').innerHTML='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'+
    gramRefs.map(function(r){ return '<a class="source-link" href="https://uhg.readthedocs.io/en/latest/'+r.page+'.html" target="_blank" rel="noopener">'+ICON_OUT+escHtml(refLabel(r))+'</a>'; }).join('')+'</div>';
  loadUHGAndTutor(word,morphParts,pages.slice(0,2),seq);
}

function loadUHGAndTutor(word,morphParts,pages,seq){
  Promise.all(pages.map(function(p){
    return fetch('/api/uhg?page='+p).then(function(r){ return r.json(); }).catch(function(){ return {text:''}; });
  })).then(function(results){
    if(seq!==analysisSeq) return;
    var uhgText=results.map(function(r){ return r.text||''; }).filter(Boolean).join('\n\n').slice(0,5000);
    showUHG(uhgText,pages,seq);
    callTutor(word,morphParts,uhgText,seq);
  });
}

function showUHG(uhgText,pages,seq){
  var el=document.getElementById('uhgContent'), ld=document.getElementById('uhgLoading');
  if(!el) return;
  if(!uhgText){ ld.style.display='none'; el.innerHTML='<p style="color:var(--t3);font-size:13px">'+escHtml(t('uhgFail'))+'</p>'; el.style.display='block'; return; }
  var preview=uhgText.slice(0,1500);
  if(LANG!=='id'){
    ld.style.display='none';
    el.innerHTML=renderMd(preview+(uhgText.length>1500?' …':'')); el.style.display='block';
    return;
  }
  // Modo indonesio: traducir el extracto del UHG
  var key=pages.join('|');
  var done=function(tr){
    if(seq!==analysisSeq) return;
    ld.style.display='none';
    el.innerHTML=renderMd(tr)+'<div class="src-note">'+escHtml(t('uhgNote'))+'</div>'; el.style.display='block';
  };
  if(UHG_TR_CACHE[key]){ done(UHG_TR_CACHE[key]); return; }
  ld.textContent=t('uhgTranslating');
  callClaude('Terjemahkan kutipan tata bahasa Ibrani berikut dari bahasa Inggris ke bahasa Indonesia akademis yang jelas dan wajar. Pertahankan kata Ibrani, transliterasi, singkatan, dan rujukan ayat apa adanya. Gunakan istilah linguistik yang lazim dalam bahasa Indonesia. Keluarkan hanya terjemahannya dalam teks biasa, tanpa Markdown dan tanpa komentar tambahan.',
    preview, 2000)
    .then(function(tr){ UHG_TR_CACHE[key]=tr; done(tr); })
    .catch(function(){
      if(seq!==analysisSeq) return;
      ld.style.display='none';
      el.innerHTML=renderMd(preview); el.style.display='block';
    });
}

// ─── TUTOR ───────────────────────────────────────────────────────────────────
function tutorSystem(short){
  if(LANG==='id'){
    return short
      ? 'Anda adalah Mevin, tutor ahli bahasa Ibrani Alkitab. Jawablah dalam bahasa Indonesia, maksimal 150 kata, secara pedagogis dan langsung. Anda boleh mengutip UHG atau Gesenius bila relevan. Tulis dalam teks biasa, tanpa Markdown.'
      : 'Anda adalah Mevin, tutor ahli bahasa Ibrani Alkitab (Perjanjian Lama), linguistik Semitik, dan eksegesis teks Masoret (WLC). Anda memakai unfoldingWord Hebrew Grammar (UHG) dan Gesenius\u2019 Hebrew Grammar sebagai rujukan; keduanya berbahasa Inggris, jadi sampaikan isinya dalam bahasa Indonesia dengan istilah teknis yang lazim. Jelaskan dalam bahasa Indonesia secara pedagogis, jelas, dan ringkas. Gunakan transliterasi bila membantu. Maksimal 200 kata, paragraf pendek. Tulis dalam teks biasa: jangan gunakan Markdown (tanpa tanda bintang, tanda pagar, atau tanda hubung daftar). Saat mengutip UHG atau Gesenius, sebutkan sumbernya secara singkat.';
  }
  return short
    ? 'Eres Mevin, tutor experto en hebreo bíblico. Responde en español, máximo 150 palabras, de forma pedagógica y directa. Puedes citar el UHG o Gesenius si es relevante. Escribe en texto plano, sin Markdown.'
    : 'Eres Mevin, tutor experto en hebreo bíblico (AT), lingüística semítica y exégesis del texto masorético (WLC). Usas el unfoldingWord Hebrew Grammar (UHG) y la Gesenius\u2019 Hebrew Grammar como fuentes de referencia. Explicas en español de forma pedagógica, clara y concisa. Usas transliteración cuando es útil. Máximo 200 palabras, párrafos cortos. Escribe en texto plano: no uses Markdown (nada de asteriscos, almohadillas ni guiones de lista). Cuando cites el UHG o Gesenius, menciona la fuente brevemente.';
}

function callTutor(word,morphParts,uhgContext,seq){
  var morphSummary=morphParts.map(function(p){ return p.label+': '+p.value; }).join(', ');
  var ta=document.getElementById('transArea');
  var trans=ta?(ta.innerText||ta.textContent||'').trim():'';
  var user;
  if(LANG==='id'){
    user='Analisislah kata Ibrani ini dari teks Alkitab ('+refText(currentRef)+'):\n\nKata: '+word.text+'\nKode morfologi OSHB: '+(word.morph||'tidak tersedia')+'\nAnalisis: '+morphSummary+'\nStrong/Leksem: H'+word.lemma;
    if(trans) user+='\n\nTerjemahan ayat:\n'+trans;
    if(uhgContext) user+='\n\n--- KUTIPAN unfoldingWord Hebrew Grammar (UHG, bahasa Inggris) ---\n'+uhgContext.slice(0,3000)+'\n---';
    user+='\n\nJelaskan kategori gramatikal, bentuk, makna dalam konteks, dan catatan eksegetis yang relevan. Bila sesuai, gunakan informasi dari UHG dan bandingkan dengan terjemahan NASB/TB/BIMK.';
  } else {
    user='Analiza esta palabra hebrea del texto bíblico ('+refText(currentRef)+'):\n\nPalabra: '+word.text+'\nCódigo morfológico OSHB: '+(word.morph||'no disponible')+'\nAnálisis: '+morphSummary+'\nStrong/Lexema: H'+word.lemma;
    if(trans) user+='\n\nTraducciones del versículo:\n'+trans;
    if(uhgContext) user+='\n\n--- EXTRACTO DEL unfoldingWord Hebrew Grammar (UHG) ---\n'+uhgContext.slice(0,3000)+'\n---';
    user+='\n\nExplica categoría gramatical, forma, significado en contexto y una observación exegética relevante. Donde sea pertinente, integra información del UHG y compara con la KJV y la RVR60.';
  }
  callClaude(tutorSystem(false),user,2000)
    .then(function(text){ showTutor(renderMd(text),seq); })
    .catch(function(e){ showTutor('<p style="color:#a32d2d;font-size:13px">'+escHtml(t('noExpl')+e.message)+'</p>',seq); });
}
function showTutor(html,seq){
  if(seq!==analysisSeq) return;
  var ld=document.getElementById('tutorLoading'), c=document.getElementById('tutorContent'), q=document.getElementById('questionRow');
  if(ld) ld.style.display='none';
  if(c){ c.innerHTML=html; c.style.display='block'; }
  if(q) q.style.display='flex';
}

function askFollowUp(){
  var inp=document.getElementById('qInput'); var q=inp.value.trim(); if(!q) return;
  var content=document.getElementById('tutorContent'); var seq=analysisSeq;
  var holderId='follow'+Date.now();
  content.insertAdjacentHTML('beforeend','<p style="margin-top:12px;padding-top:10px;border-top:.5px solid var(--bdl);color:var(--t2);font-style:italic">\u201C'+escHtml(q)+'\u201D</p><div id="'+holderId+'" class="tutor-loading">'+escHtml(t('processing'))+'</div>');
  inp.value='';
  var word=currentWords[selectedIdx];
  var ctx=word?(LANG==='id'
    ? 'Kata yang dibahas adalah "'+word.text+'" (morf: '+word.morph+', H'+word.lemma+') dalam '+refText(currentRef)+'.'
    : 'La palabra es "'+word.text+'" (morph: '+word.morph+', H'+word.lemma+') en '+refText(currentRef)+'.'):'';
  callClaude(tutorSystem(true),ctx+'\n\n'+(LANG==='id'?'Pertanyaan: ':'Pregunta: ')+q,1500)
    .then(function(text){ var el=document.getElementById(holderId); if(el&&seq===analysisSeq){ el.className=''; el.innerHTML=renderMd(text); } })
    .catch(function(e){ var el=document.getElementById(holderId); if(el){ el.className=''; el.innerHTML='<p style="color:#a32d2d;font-size:13px">'+escHtml(t('connErr')+e.message)+'</p>'; } });
}

// ─── CAMBIO DE IDIOMA ────────────────────────────────────────────────────────
function applyLang(){
  document.documentElement.lang=LANG;
  Array.prototype.slice.call(document.querySelectorAll('[data-i18n]')).forEach(function(el){ el.textContent=t(el.getAttribute('data-i18n')); });
  document.getElementById('refInput').placeholder=t('placeholder');
  document.getElementById('footer').innerHTML=t('footer');
  var sel=document.getElementById('versionSel'), prev=sel.value;
  sel.innerHTML=VERSIONS[LANG].map(function(o){ return '<option value="'+o.v+'">'+escHtml(o.l==='onlyWLC'?t('onlyWLC'):o.l)+'</option>'; }).join('');
  sel.value=VERSIONS[LANG].some(function(o){ return o.v===prev; })?prev:'all';
  document.getElementById('topDesc').textContent='WLC · OSHB · UHG · Gesenius · SHEBANQ · '+(LANG==='id'?'NASB / TB / BIMK':'KJV / RVR60');
  Array.prototype.slice.call(document.querySelectorAll('.lang-btn')).forEach(function(b){ b.classList.toggle('active',b.dataset.lang===LANG); });
  document.getElementById('quickTags').innerHTML=QUICK[LANG].map(function(r){ return '<span class="tag" data-ref="'+r+'">'+r+'</span>'; }).join('');
  Array.prototype.slice.call(document.querySelectorAll('#quickTags .tag')).forEach(function(el){
    el.addEventListener('click',function(){ quickLoad(el.dataset.ref); });
  });
}
function setLang(lang){
  if(lang===LANG) return;
  LANG=lang;
  try{ localStorage.setItem('mevin-lang',lang); }catch(e){}
  applyLang();
  clearError();
  if(currentRef){
    renderVerse();
    if(selectedIdx>=0) analyzeWord(selectedIdx); else emptyPanel('&#128214;',t('empty'));
  } else emptyPanel('&#128214;',t('empty'));
}

function quickLoad(r){ document.getElementById('refInput').value=r; loadVerse(r); }

Array.prototype.slice.call(document.querySelectorAll('.lang-btn')).forEach(function(b){
  b.addEventListener('click',function(){ setLang(b.dataset.lang); });
});
document.getElementById('loadBtn').addEventListener('click',function(){ loadVerse(document.getElementById('refInput').value); });
document.getElementById('refInput').addEventListener('keydown',function(e){ if(e.key==='Enter') loadVerse(e.target.value); });
document.getElementById('versionSel').addEventListener('change',function(){ if(currentRef) loadTranslations(currentRef,this.value); });

applyLang();
var startRef=QUICK[LANG][0];
document.getElementById('refInput').value=startRef;
loadVerse(startRef);
</script>
